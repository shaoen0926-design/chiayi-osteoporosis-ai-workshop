<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#fff9ed"/><g font-family="sans-serif" fill="#243b35"><text x="45" y="50" font-size="28">骨鬆簡報理解測驗答對率（虛構）</text><text x="45" y="128" font-size="23">Q1 認識骨鬆</text><rect x="240" y="100" width="360" height="42" rx="5" fill="#216253"/><text x="615" y="129" font-size="22">60%（n=20）</text><text x="45" y="210" font-size="23">Q2 營養迷思</text><rect x="240" y="182" width="300" height="42" rx="5" fill="#216253"/><text x="555" y="211" font-size="22">50%（n=18）</text><text x="45" y="292" font-size="23">Q3 活動原則</text><rect x="240" y="264" width="420" height="42" rx="5" fill="#216253"/><text x="675" y="293" font-size="22">70%（n=20）</text><text x="45" y="374" font-size="23">Q4 居家防跌</text><rect x="240" y="346" width="450" height="42" rx="5" fill="#216253"/><text x="705" y="375" font-size="22">75%（n=16）</text><text x="45" y="456" font-size="23">Q5 用藥提問</text><rect x="240" y="428" width="300" height="42" rx="5" fill="#216253"/><text x="555" y="457" font-size="22">50%（n=20）</text><text x="240" y="545" font-size="19">0%</text><text x="390" y="545" font-size="19">25%</text><text x="540" y="545" font-size="19">50%</text><text x="690" y="545" font-size="19">75%</text><text x="840" y="545" font-size="19">100%</text><text x="45" y="595" font-size="19">n＝各題有效作答數；單次示範測驗不能推論改稿成效或醫療結果。</text></g></svg>