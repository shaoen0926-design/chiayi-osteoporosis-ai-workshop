<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#fff9ed"/><g font-family="sans-serif" fill="#243b35"><text x="50" y="55" font-size="30">骨鬆簡報理解測驗（虛構練習）</text><text x="50" y="120" font-size="24">題號／主題</text><text x="480" y="120" font-size="24">有效作答數</text><text x="800" y="120" font-size="24">答對數</text><path d="M50 135 H1030" stroke="#d9e1d9"/><text x="50" y="178" font-size="24">Q1 認識骨鬆</text><text x="480" y="178" font-size="24">20</text><text x="800" y="178" font-size="24">12</text><path d="M50 193 H1030" stroke="#d9e1d9"/><text x="50" y="236" font-size="24">Q2 營養迷思</text><text x="480" y="236" font-size="24">18</text><text x="800" y="236" font-size="24">9</text><path d="M50 251 H1030" stroke="#d9e1d9"/><text x="50" y="294" font-size="24">Q3 活動原則</text><text x="480" y="294" font-size="24">20</text><text x="800" y="294" font-size="24">14</text><path d="M50 309 H1030" stroke="#d9e1d9"/><text x="50" y="352" font-size="24">Q4 居家防跌</text><text x="480" y="352" font-size="24">16</text><text x="800" y="352" font-size="24">12</text><path d="M50 367 H1030" stroke="#d9e1d9"/><text x="50" y="410" font-size="24">Q5 用藥提問</text><text x="480" y="410" font-size="24">20</text><text x="800" y="410" font-size="24">10</text><path d="M50 425 H1030" stroke="#d9e1d9"/><text x="50" y="468" font-size="24">原圖合計</text><text x="480" y="468" font-size="24">94</text><text x="800" y="468" font-size="24">58</text><path d="M50 483 H1030" stroke="#d9e1d9"/><text x="50" y="585" font-size="19">請擷取原值後重算合計；圖中刻意保留一項誤植。</text></g></svg>